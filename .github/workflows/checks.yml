name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install check dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Content checks
        run: python scripts/check_content.py
      - name: Build package
        run: python scripts/build_plugin.py
